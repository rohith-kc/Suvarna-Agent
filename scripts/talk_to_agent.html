const select = document.getElementById("scenarioSelect");
const card = document.getElementById("card");
const transcript = document.getElementById("transcript");
const statusEl = document.getElementById("status");
const startBtn = document.getElementById("startBtn");
const endBtn = document.getElementById("endBtn");
const textInput = document.getElementById("textInput");

let conversation = null;

for (const s of SCENARIOS) {
  const opt = document.createElement("option");
  opt.value = s.id;
  opt.textContent = s.name;
  select.appendChild(opt);
}

function renderCard(scenario) {
  const scriptHtml = scenario.script.map((l, i) => `<li>${l}</li>`).join("");
  const mustNotHtml = scenario.must_not.map((l) => `<li class="must-not">${l}</li>`).join("");
  card.innerHTML = `
    <h3>${scenario.name}</h3>
    <p><b>Expected outcome:</b> ${scenario.expected_outcome}</p>
    <p><b>Say roughly this, in your own words:</b></p>
    <ol>${scriptHtml}</ol>
    <p><b>Agent must NOT:</b></p>
    <ul>${mustNotHtml || "<li>(nothing specific)</li>"}</ul>
  `;
}

function currentScenario() {
  return SCENARIOS.find((s) => s.id === select.value);
}

renderCard(currentScenario());
select.addEventListener("change", () => renderCard(currentScenario()));

function logLine(speaker, text) {
  const div = document.createElement("div");
  div.innerHTML = `<span class="${speaker}">${speaker === "agent" ? "Asha" : "You"}:</span> ${text}`;
  transcript.appendChild(div);
  transcript.scrollTop = transcript.scrollHeight;
}

startBtn.addEventListener("click", async () => {
  const scenario = currentScenario();
  transcript.innerHTML = "";
  statusEl.textContent = "Connecting...";
  startBtn.disabled = true;
  select.disabled = true;

  try {
    conversation = await Conversation.startSession({
      agentId: AGENT_ID,
      dynamicVariables: scenario.variables,
      onConnect: () => { statusEl.textContent = "Connected — speak when ready."; },
      onDisconnect: () => { statusEl.textContent = "Disconnected."; endBtn.disabled = true; startBtn.disabled = false; select.disabled = false; },
      onMessage: (msg) => logLine("agent", msg.message ?? JSON.stringify(msg)),
      onUserTranscript: (t) => logLine("user", t.message ?? JSON.stringify(t)),
      onError: (e) => { statusEl.textContent = "Error: " + e; console.error(e); },
    });
    endBtn.disabled = false;
    textInput.disabled = false;
  } catch (e) {
    statusEl.textContent = "Failed to start: " + e;
    startBtn.disabled = false;
    select.disabled = false;
    console.error(e);
  }
});

endBtn.addEventListener("click", async () => {
  if (conversation) {
    await conversation.endSession();
    conversation = null;
  }
  endBtn.disabled = true;
  startBtn.disabled = false;
  select.disabled = false;
  textInput.disabled = true;
  statusEl.textContent = "Ended.";
});

textInput.addEventListener("keydown", (e) => {
  if (e.key !== "Enter" || !conversation || !textInput.value.trim()) return;
  const text = textInput.value.trim();
  logLine("user", text);
  textInput.value = "";
  try {
    conversation.sendUserMessage(text);
  } catch (err) {
    statusEl.textContent = "Couldn't send text: " + err;
    console.error(err);
  }
});
</script>
